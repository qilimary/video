      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          rm -f settings.gradle build.gradle gradle.properties
          base64 -d "$RUNNER_TEMP/format_converter_v70.tar.gz.b64" > "$RUNNER_TEMP/format_converter_v70.tar.gz"
          tar -xzf "$RUNNER_TEMP/format_converter_v70.tar.gz" -C "$GITHUB_WORKSPACE"
          test -f app/src/main/java/com/qi/formatconverter/MainActivity.java
          test -f app/src/main/java/com/qi/formatconverter/EditorVideoPlayer.java
          test -f app/build.gradle
          echo "Android project restored successfully."

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "${APK_PATH}" ]; then
            echo "没有找到可安装 APK，实际输出目录如下："
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "找到 APK：${APK_PATH}"
          cp "${APK_PATH}" FormatConverter.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose FormatConverter.apk
          sha256sum FormatConverter.apk > FormatConverter.sha256
          ls -lh FormatConverter.apk FormatConverter.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FormatConverter-v7.0
          path: |
            FormatConverter.apk
            FormatConverter.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
