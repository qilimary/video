name: Build Format Converter v8.0

on:
  push:
    branches: [main, 'codex/**']
    paths: ['.github/workflows/build.yml', 'android_project.py', '转换.png']
  pull_request:
    paths: ['.github/workflows/build.yml', 'android_project.py', '转换.png']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          # Some SDK archives include an additional platform directory.
          SDK_PLATFORM="$ANDROID_HOME/platforms/android-36"
          if [ ! -f "$SDK_PLATFORM/android.jar" ] && [ -f "$SDK_PLATFORM/android-36/android.jar" ]; then
            cp -a "$SDK_PLATFORM/android-36/." "$SDK_PLATFORM/"
            rm -rf "$SDK_PLATFORM/android-36"
          fi
          test -f "$SDK_PLATFORM/android.jar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Reuse the development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: format-converter-development-signing-v1

      - name: Generate project and icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python android_project.py --icon 转换.png

      - name: Test and build optimized APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify and package APK
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk FormatConverter-v8.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose FormatConverter-v8.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 FormatConverter-v8.0.apk
          sha256sum FormatConverter-v8.0.apk > FormatConverter-v8.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FormatConverter-v8.0
          path: |
            FormatConverter-v8.0.apk
            FormatConverter-v8.0.sha256
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/

      - uses: actions/upload-artifact@v4
        with:
          name: device-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          compression-level: 0

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: device-test-apks
          path: apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/debug/app-debug.apk
            adb install -r apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.qi.formatconverter.test/androidx.test.runner.AndroidJUnitRunner | tee device-tests.txt
            grep -Eq 'OK \([0-9]+ tests?\)' device-tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-api-${{ matrix.api }}
          path: device-tests.txt
